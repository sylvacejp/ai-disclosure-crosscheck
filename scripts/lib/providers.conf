# providers.conf — AI provider detection signatures for signal A (server-side call)
# and signal B/C (provider-name disclosure matching).
#
# Format: one provider per line, tab-separated:
#   <extended-regex-pattern><TAB><Provider Display Name>
#
# The pattern is matched against Node.js/JavaScript/TypeScript source under
# --server-dir (require()/import specifiers, or the provider's HTTP endpoint).
# Lines starting with # are comments and blank lines are ignored.
#
# This list intentionally covers the initial scope only (spec section 2-2 /
# 4-4): Node.js/JavaScript/TypeScript SDK imports and endpoint literals. Adding
# a provider does not require touching scan.sh — this file is the single
# source of truth, which is also the extension point for future OSS
# contributors (see README "Extending the provider list").
api\.openai\.com|require\([\"']openai[\"']\)|from [\"']openai[\"']	OpenAI
api\.anthropic\.com|@anthropic-ai/sdk|require\([\"']anthropic[\"']\)	Anthropic
generativelanguage\.googleapis\.com|@google/generative-ai|@google-cloud/vertexai	Gemini
api\.mistral\.ai|@mistralai/mistralai	Mistral
openrouter\.ai	OpenRouter
api\.groq\.com|groq-sdk	Groq
api\.perplexity\.ai	Perplexity
api\.together\.xyz|together-ai	Together
